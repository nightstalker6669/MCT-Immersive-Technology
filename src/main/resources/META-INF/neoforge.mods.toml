modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
description = '''${mod_description}'''
authors = "${mod_authors}"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/mct-immersive-technology"
logoFile = "ITlogo.png"
credits = "tgstyle (author), Peter (new models), MagneticPrism (started the port), KHAZ (new sounds), and the Immersive Engineering Team (code dependencies)"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "immersiveengineering"
type = "required"
versionRange = "[${version_ie},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "immersiveconvergence"
type = "required"
versionRange = "[${version_ic},)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "mixins.immersivetechnology.json"
