import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'idea'
    id 'eclipse'
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.6'
    id 'net.neoforged.moddev' version '2.0.141'
}

def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }

def gradleProps = new Properties()
file('gradle.properties').withInputStream { gradleProps.load(it) }

version = versionProps.getProperty('version')
group = 'mctmods.immersivetechnology'

def versionBuildNumber = versionProps.getProperty('build_number')?.toInteger() ?: 0
def stage = versionProps.getProperty('stage') ?: ''
def modId = gradleProps['mod_id']
def minecraftVersion = versionProps['version_mc']
def neoVersion = versionProps['version_neo']
def jeiVersion = versionProps['version_jei']
def ieVersion = versionProps['version_ie']
def icVersion = versionProps['version_ic']

def versionReplaces = {
    [
        'version'              : project.version,
        'build_number'         : versionBuildNumber,
        'stage'                : stage,
        'version_mc'           : minecraftVersion,
        'version_neo'          : neoVersion,
        'version_ie'           : ieVersion,
        'version_ic'           : icVersion,
        'minecraft_version'    : gradleProps['minecraft_version'],
        'minecraft_version_range': gradleProps['minecraft_version_range'],
        'neo_version'          : gradleProps['neo_version'],
        'neo_version_range'    : gradleProps['neo_version_range'],
        'loader_version_range' : gradleProps['loader_version_range'],
        'mod_id'               : modId,
        'mod_name'             : gradleProps['mod_name'],
        'mod_license'          : gradleProps['mod_license'],
        'mod_version'          : gradleProps['mod_version'],
        'mod_group_id'         : gradleProps['mod_group_id'],
        'mod_authors'          : gradleProps['mod_authors'],
        'mod_description'      : gradleProps['mod_description'],
    ] as Map<String, Object>
}

base {
    archivesName = "MCT-ImmersiveTechnology-${minecraftVersion}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(Jar).configureEach {
    zip64 = true
}

sourceSets {
    main {
        resources.srcDir "$rootDir/src/generated/resources"
    }
    datagen {
        java.srcDir "$rootDir/src/datagen/java"
        resources.srcDir "$rootDir/src/datagen/resources"
        compileClasspath += sourceSets.main.output
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    gametest {
        java.srcDir "$rootDir/src/gametest/java"
        resources.srcDir "$rootDir/src/gametest/resources"
        compileClasspath += sourceSets.main.output
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = neoVersion
    validateAccessTransformers = true

    addModdingDependenciesTo sourceSets.datagen
    addModdingDependenciesTo sourceSets.gametest

    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }
        client {
            client()
            sourceSet = sourceSets.main
            gameDirectory = project.file('run/client')
            programArguments.addAll '--username', 'tgstyle', '--width', '1920', '--height', '1080'
        }
        server {
            server()
            sourceSet = sourceSets.main
            gameDirectory = project.file('run/server')
            programArgument '-nogui'
        }
        data {
            data()
            sourceSet = sourceSets.datagen
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', modId, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('run/gametest')
        }
    }

    mods {
        immersivetechnology {
            sourceSet sourceSets.main
            sourceSet sourceSets.datagen
            sourceSet sourceSets.gametest
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        url = 'https://squiddev.cc/maven/'
        content {
            includeGroup 'cc.tweaked'
            includeModule 'org.squiddev', 'Cobalt'
        }
    }
}

def ieEmbeddedJarDir = layout.buildDirectory.dir('embedded-libs')
def prepareIEDualCodecs = tasks.register('prepareIEDualCodecs') {
    group = 'build setup'
    description = 'Extracts IE embedded codec libraries needed on the compile classpath.'
    outputs.dir(ieEmbeddedJarDir)

    doLast {
        def ieCacheDir = file("${System.properties['user.home']}/.gradle/caches/modules-2/files-2.1/curse.maven/immersive-engineering-231951/6466513")
        def ieJar = fileTree(ieCacheDir) {
            include '**/*.jar'
        }.files.find { it.name == 'immersive-engineering-231951-6466513.jar' }
        if (ieJar == null) {
            throw new GradleException("Could not find the resolved Immersive Engineering jar needed to extract embedded DualCodecs.")
        }

        copy {
            from(zipTree(ieJar)) {
                include 'META-INF/jarjar/DualCodecs-*.jar'
                eachFile { details -> details.path = details.name }
            }
            into ieEmbeddedJarDir
        }
    }
}

def ieEmbeddedDependencies = files({
    def dir = ieEmbeddedJarDir.get().asFile
    if (!dir.exists()) {
        return []
    }
    return fileTree(dir) {
        include 'DualCodecs-*.jar'
    }
}).builtBy(prepareIEDualCodecs)

def icProjectDir = file('external/ImmersiveConvergence')
def icLibDir = file("$icProjectDir/build/libs")
def icJarPattern = "ImmersiveConvergence-${minecraftVersion}-*-dev.jar"
def findMatchingIcJars = {
    if (!icLibDir.exists()) {
        return [] as Set<File>
    }
    fileTree(icLibDir) {
        include icJarPattern
        exclude '**/*-sources.jar'
    }.files
}
def findLatestIcJar = {
    def matchingIcJars = findMatchingIcJars()
    matchingIcJars.isEmpty() ? null : matchingIcJars.sort { a, b -> b.lastModified() <=> a.lastModified() }.first()
}

def prepareImmersiveConvergence = tasks.register('prepareImmersiveConvergence') {
    group = 'build setup'
    description = 'Builds the Immersive Convergence submodule dev jar used for local development.'
    outputs.upToDateWhen { false }

    doLast {
        if (!icProjectDir.exists()) {
            throw new GradleException(
                    "Immersive Convergence is missing at ${project.relativePath(icProjectDir)}. " +
                            "Run `git submodule update --init --recursive` from the repo root."
            )
        }

        def wrapperName = System.getProperty('os.name').toLowerCase().contains('windows') ? 'gradlew.bat' : 'gradlew'
        def wrapper = new File(icProjectDir, wrapperName)
        if (!wrapper.exists()) {
            throw new GradleException(
                    "Expected the Immersive Convergence Gradle wrapper at ${project.relativePath(wrapper)} but it was not found."
            )
        }

        logger.lifecycle("Building Immersive Convergence dev jar from ${project.relativePath(icProjectDir)}")
        try {
            exec {
                workingDir = icProjectDir
                if (wrapperName.endsWith('.bat')) {
                    commandLine 'cmd', '/c', wrapperName, 'devJar', '--no-daemon', '--stacktrace'
                } else {
                    commandLine "./${wrapperName}", 'devJar', '--no-daemon', '--stacktrace'
                }
            }
        } catch (Exception ex) {
            throw new GradleException(
                    "Failed to build Immersive Convergence from ${project.relativePath(icProjectDir)}. " +
                            "Port that submodule to Minecraft ${minecraftVersion} / NeoForge ${neoVersion} and rerun the build.",
                    ex
            )
        }

        def icJar = findLatestIcJar()
        if (icJar == null) {
            throw new GradleException(
                    "Immersive Convergence did not produce ${icJarPattern} under ${project.relativePath(icLibDir)}. " +
                            "The submodule still needs to target Minecraft ${minecraftVersion} and publish a matching dev jar."
            )
        }
        logger.lifecycle("Prepared Immersive Convergence dev jar: ${icJar.name}")
    }
}

def icDependency = files({
    def icJar = findLatestIcJar()
    if (icJar == null) {
        logger.warn(
                "No local Immersive Convergence dev jar found under ${project.relativePath(icLibDir)}. " +
                        "Tasks that depend on IC will build the submodule first."
        )
        return []
    }
    return icJar
}).builtBy(prepareImmersiveConvergence)

tasks.matching { it.name in ['compileJava', 'compileDatagenJava', 'runClient', 'runServer', 'runData'] }.configureEach {
    dependsOn prepareImmersiveConvergence
    dependsOn prepareIEDualCodecs
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraftVersion}-neoforge-api:${jeiVersion}"
    compileOnly "mezz.jei:jei-${minecraftVersion}-common-api:${jeiVersion}"
    runtimeOnly "mezz.jei:jei-${minecraftVersion}-neoforge:${jeiVersion}"

    implementation "curse.maven:immersive-engineering-231951:6466513"
    implementation "curse.maven:jade-324717:6198776"
    compileOnly "curse.maven:the-one-probe-245211:6106996"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation icDependency
    compileOnly ieEmbeddedDependencies
}

def jsonPatterns = ['**/*.json', '**/*.mcmeta']

processResources {
    doNotTrackState("Resource outputs are normalized in-place after copy, which conflicts with Gradle's tracked-state checks across consecutive runData and runtime tasks.")
    duplicatesStrategy = DuplicatesStrategy.FAIL
    inputs.properties(versionReplaces())
    filesMatching('META-INF/neoforge.mods.toml') {
        expand versionReplaces()
    }
    exclude '.cache'
    doLast {
        fileTree(dir: getOutputs().getFiles().getAsPath(), includes: jsonPatterns).each { File jsonFile ->
            jsonFile.setText(JsonOutput.toJson(new JsonSlurper().parse(jsonFile, 'UTF-8')))
        }
    }
}

def refreshGeneratedResources = tasks.register('refreshGeneratedResources') {
    inputs.dir("$rootDir/src/generated/resources")
    outputs.dir(layout.buildDirectory.dir('resources/main'))
    doLast {
        copy {
            from("$rootDir/src/generated/resources")
            into(layout.buildDirectory.dir('resources/main'))
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
        }
        fileTree(dir: layout.buildDirectory.dir('resources/main').get().asFile, includes: jsonPatterns).each { File jsonFile ->
            jsonFile.setText(JsonOutput.toJson(new JsonSlurper().parse(jsonFile, 'UTF-8')))
        }
    }
}

tasks.named('runData').configure {
    finalizedBy refreshGeneratedResources
}

tasks.named('compileDatagenJava').configure {
    dependsOn refreshGeneratedResources
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn refreshGeneratedResources
}


tasks.register('datagenJar', Jar) {
    dependsOn tasks.named('datagenClasses')
    archiveBaseName.set("MCT-ImmersiveTechnology-${minecraftVersion}")
    archiveClassifier.set('datagen')
    from sourceSets.datagen.output
    manifest {
        attributes 'FMLModType': 'GAMELIBRARY'
    }
}

artifacts {
    archives tasks.named('datagenJar')
}
